[versions]
# Held at 8.x: AGP 9.x is available but Sentry Gradle Plugin 6.10.0 predates AGP 9
# and compatibility is unverified. Revisit when Sentry ships AGP 9 support.
agp = "8.13.2"
compileSdk = "35"
kotlin = "2.4.0"
# #137: AGP 8.13.2 bundles an R8 that can't read Kotlin 2.4 metadata. Kotlin 2.4 needs R8 9.1.29+.
# Remove this override (and the buildscript classpath entry) when AGP is bumped to 9.x.
r8 = "9.5.26"
sentry = "8.43.1"
sentry-plugin = "6.10.0"
timber = "5.0.1"
coroutines = "1.11.0"
junit = "4.13.2"
androidx-test-runner = "1.6.2"
androidx-test-ext-junit = "1.2.1"
appcompat = "1.7.1"
constraintlayout = "2.2.1"
material = "1.14.0"

[libraries]
r8 = { module = "com.android.tools:r8", version.ref = "r8" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
sentry-android = { module = "io.sentry:sentry-android", version.ref = "sentry" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
material = { module = "com.google.android.material:material", version.ref = "material" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
sentry = { id = "io.sentry.android.gradle", version.ref = "sentry-plugin" }
